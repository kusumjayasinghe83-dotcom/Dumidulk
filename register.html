<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Create your DumiduUddipana account."
  >

  <title>Create Account | DumiduUddipana</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

<div class="auth-page">

  <div class="auth-box">


    <!-- LOGO -->

    <a
      href="index.html"
      class="logo"
    >

      <span class="logo-box">
        DU
      </span>

      <span>
        DumiduUddipana
      </span>

    </a>


    <!-- TITLE -->

    <h1>
      Create your account
    </h1>


    <p>
      Create an account to start learning.
    </p>


    <!-- REGISTER FORM -->

    <form
      id="registerForm"
    >


      <!-- NAME -->

      <label for="name">
        Full Name
      </label>

      <input
        type="text"
        id="name"
        placeholder="Your name"
        autocomplete="name"
        required
      >


      <!-- EMAIL -->

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        autocomplete="email"
        required
      >


      <!-- PASSWORD -->

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="8"
        autocomplete="new-password"
        required
      >


      <!-- CONFIRM PASSWORD -->

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="8"
        autocomplete="new-password"
        required
      >


      <!-- BUTTON -->

      <button
        type="submit"
        class="btn primary"
      >

        Create Account

      </button>


    </form>


    <!-- MESSAGE -->

    <p
      id="registerMessage"
      aria-live="polite"
    ></p>


    <!-- LOGIN -->

    <p>

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </p>


    <!-- HOME -->

    <p>

      <a href="index.html">
        ← Back to Home
      </a>

    </p>


  </div>

</div>


<!-- SUPABASE -->

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- YOUR JAVASCRIPT -->

<script src="script.js"></script>


</body>

</html>
